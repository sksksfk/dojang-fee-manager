<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도장 회비 관리</title>
<style>
:root{--ink:#17251f;--muted:#728078;--line:#e5ebe7;--paper:#fff;--bg:#f4f7f4;--green:#28664a;--lime:#d9ed86;--red:#c85045;--amber:#e4a53b;--blue:#5078b8;--shadow:0 10px 30px #1839280c}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:1400px;margin:auto;padding:26px 32px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;background:var(--green);border-radius:14px;display:grid;place-items:center;color:white;font-size:22px}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0 0;font-size:12px;color:var(--muted)}.top-actions{display:flex;gap:9px}.btn{padding:10px 14px;border-radius:10px;font-weight:700;font-size:13px;background:#e9efeb;color:var(--ink)}.btn.primary{background:var(--green);color:#fff}.btn.light{background:#fff;border:1px solid var(--line)}.btn.danger{background:#fff0ed;color:var(--red)}.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px}.month-controls{display:flex;gap:8px;align-items:center}.month-controls button{width:36px;height:36px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:18px}.month-label{font-weight:800;font-size:22px;min-width:110px;text-align:center}.pill{font-size:12px;color:var(--muted);background:#e9efeb;border-radius:20px;padding:7px 11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:20px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:17px 19px;box-shadow:var(--shadow)}.stat .label{font-size:12px;color:var(--muted)}.stat .value{font-weight:800;font-size:24px;margin-top:8px;letter-spacing:-.5px}.stat .sub{font-size:11px;color:var(--muted);margin-top:5px}.stat.green .value{color:var(--green)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:18px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.panel-head{padding:18px 20px 13px;display:flex;justify-content:space-between;align-items:center}.panel-head h2{font-size:16px;margin:0}.panel-head p{color:var(--muted);font-size:12px;margin:5px 0 0}.table-wrap{overflow:auto;border-top:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:690px}th{text-align:left;color:#829087;font-size:11px;font-weight:700;padding:12px 15px;background:#fafcfb;white-space:nowrap}td{padding:12px 15px;border-top:1px solid #eff2f0;font-size:13px;white-space:nowrap}.student{display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:12px;background:#edf2e9;color:var(--green);display:grid;place-items:center;font-weight:800}.name{font-weight:750;cursor:pointer}.name:hover{color:var(--green);text-decoration:underline}.subline{font-size:11px;color:var(--muted);margin-top:3px}.money{font-weight:700}.status{font-size:11px;padding:6px 9px;border-radius:20px;font-weight:700}.status.paid{background:#e6f3eb;color:#28664a}.status.partial{background:#fff2d9;color:#926513}.status.unpaid{background:#fcebe8;color:#b54d40}.row-actions{display:flex;gap:6px}.tiny{padding:7px 9px;border-radius:8px;background:#f0f4f1;color:#31453a;font-size:11px;font-weight:700}.tiny.pay{background:#28664a;color:white}.progress{width:64px;height:6px;border-radius:9px;background:#edf1ee;overflow:hidden}.progress i{display:block;height:100%;background:#65a17b}.side{display:grid;gap:14px}.side .panel{padding:17px}.side h3{margin:0 0 14px;font-size:14px}.side p{font-size:12px;color:var(--muted);line-height:1.6}.minirow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid #eff2f0;font-size:12px}.minirow b{font-size:12px}.barrow{display:flex;align-items:center;gap:8px;margin:13px 0;font-size:11px}.barrow .bar{height:7px;border-radius:9px;background:#e8eeea;flex:1;overflow:hidden}.barrow .bar i{display:block;height:100%;background:#77a88a}.barrow strong{width:35px;text-align:right}.empty{text-align:center;padding:45px 18px;color:var(--muted);font-size:13px}.overlay{position:fixed;inset:0;background:#14251dcc;display:grid;place-items:center;z-index:5;padding:18px}.modal{width:min(540px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:23px;box-shadow:0 20px 60px #0003}.modal h2{font-size:18px;margin:0 0 6px}.modal .hint{font-size:12px;color:var(--muted);margin:0 0 17px;line-height:1.55}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#627168;font-weight:700}.field input,.field select{border:1px solid #dfe7e1;border-radius:9px;padding:10px 11px;outline:none;background:white}.field input:focus,.field select:focus{border-color:#6a9b7a;box-shadow:0 0 0 3px #28664a18}.checks{display:flex;flex-wrap:wrap;gap:7px}.checks label{background:#f2f6f3;padding:8px 10px;border-radius:9px;font-size:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:9px}.login{min-height:100vh;background:radial-gradient(circle at 20% 10%,#e8f0de,transparent 35%),var(--bg);display:grid;place-items:center;padding:20px}.loginbox{width:min(400px,100%);background:#fff;border-radius:20px;padding:32px;box-shadow:var(--shadow);border:1px solid var(--line)}.loginbox h1{font-size:22px;margin:0 0 8px}.loginbox p{font-size:13px;color:var(--muted);line-height:1.6}.loginbox input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0}.loginbox .btn{width:100%;margin-top:8px}.error{color:var(--red);font-size:12px;min-height:18px}.note{padding:11px;border-radius:10px;background:#fff7df;color:#745d25;font-size:11px;line-height:1.55;margin-top:12px}.search{border:1px solid var(--line);border-radius:9px;padding:9px 11px;max-width:180px}.hide{display:none!important}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.app{padding:18px 13px 36px}.top{align-items:flex-start}.top-actions .btn{padding:9px;font-size:11px}.brand h1{font-size:17px}.monthbar{align-items:flex-start;gap:8px;flex-direction:column}.stats{gap:8px}.stat{padding:13px}.stat .value{font-size:19px}.side{grid-template-columns:1fr}.panel-head{padding:15px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}}
@media print{body{background:#fff}.app{display:none!important}.overlay{position:static;display:block;background:white;padding:0}.modal{width:100%;max-height:none;overflow:visible;border:0;box-shadow:none;padding:8px}.modal-actions,.no-print,.hint{display:none!important}.printhead{display:block!important}.print-table{width:100%;border-collapse:collapse;margin-top:18px}.print-table th,.print-table td{border:1px solid #bbb;padding:8px;text-align:left}.print-table th{background:#eee!important}.print-total{margin-top:20px;font-size:16px;font-weight:bold}.printnote{font-size:11px;color:#555;margin-top:24px}}
</style></head><body>
<div id="root"></div>
<script>
const KEY='dojang_fee_manager_v1';let db,viewDate=new Date(),filter='';const money=n=>new Intl.NumberFormat('ko-KR').format(+n||0)+'원';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ym=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;const getData=()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}};const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function monthRec(stu,key=ym(viewDate)){stu.records??={};stu.records[key]??=[];return stu.records[key]}function sumRec(stu,key=ym(viewDate)){return monthRec(stu,key).reduce((a,x)=>a+(+x.amount||0),0)}function due(stu){return stu.fee??db.settings.defaultFee}
function render(){db=getData();if(!db){root.innerHTML=`<div class="login"><div class="loginbox"><div class="logo">道</div><h1>도장 회비 관리</h1><p>처음 사용할 비밀번호를 설정하세요.</p><form id="setup"><input id="pw1" type="password" required minlength="4" placeholder="비밀번호 (4자 이상)"><input id="pw2" type="password" required minlength="4" placeholder="비밀번호 확인"><div class="error" id="err"></div><button class="btn primary">비밀번호 설정</button></form><div class="note">이 앱은 별도 서버 없이 현재 브라우저에 데이터를 저장합니다. 브라우저 데이터 삭제나 기기 변경 전 백업을 권장합니다.</div></div></div>`;document.querySelector('#setup').onsubmit=async e=>{e.preventDefault();if(pw1.value!==pw2.value){err.textContent='비밀번호가 서로 다릅니다.';return}db={password:await hash(pw1.value),settings:{defaultFee:150000},students:[]};save();sessionStorage.setItem('du_unlocked','1');render()};return}if(sessionStorage.getItem('du_unlocked')!=='1'){root.innerHTML=`<div class="login"><div class="loginbox"><div class="logo">道</div><h1>도장 회비 관리</h1><p>설정한 비밀번호를 입력하세요.</p><form id="login"><input id="pw" type="password" required placeholder="비밀번호"><div class="error" id="err"></div><button class="btn primary">들어가기</button></form><div class="note">비밀번호는 이 브라우저의 로컬 데이터로 관리됩니다. 이 앱은 서버 기반 계정 보안 기능을 제공하지 않습니다.</div></div></div>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();if(await hash(pw.value)===db.password){db.unlocked=true;sessionStorage.setItem('du_unlocked','1');render()}else err.textContent='비밀번호가 맞지 않습니다.'};return}
const key=ym(viewDate),students=db.students.filter(s=>s.name.toLowerCase().includes(filter.toLowerCase())),all=db.students,totalDue=all.reduce((a,s)=>a+due(s),0),collected=all.reduce((a,s)=>a+Math.min(sumRec(s,key),due(s)),0),paid=all.filter(s=>sumRec(s,key)>=due(s)).length,partial=all.filter(s=>sumRec(s,key)>0&&sumRec(s,key)<due(s)).length;
root.innerHTML=`<main class="app"><header class="top"><div class="brand"><div class="logo">道</div><div><h1>도장 회비 관리</h1><p>수련생 월회비를 한눈에 확인하세요</p></div></div><div class="top-actions"><button class="btn light" id="settings">⚙ 기본 설정</button><button class="btn primary" id="add">＋ 수련생 등록</button></div></header><div class="monthbar"><div class="month-controls"><button id="prev">‹</button><div class="month-label">${viewDate.getFullYear()}년 ${viewDate.getMonth()+1}월</div><button id="next">›</button><button class="btn light" id="today">이번 달</button></div><span class="pill">${all.length}명 등록</span></div><section class="stats"><div class="stat"><div class="label">이번 달 납부액</div><div class="value green">${money(collected)}</div><div class="sub">수납 목표 ${money(totalDue)}</div></div><div class="stat"><div class="label">납부 완료</div><div class="value">${paid}<small style="font-size:13px;color:#728078"> / ${all.length}명</small></div><div class="sub">완납 기준</div></div><div class="stat"><div class="label">부분 납부</div><div class="value" style="color:#bd831c">${partial}명</div><div class="sub">나머지 회비 확인 필요</div></div><div class="stat"><div class="label">미납</div><div class="value" style="color:#c85045">${all.length-paid-partial}명</div><div class="sub">이번 달 납부 기록 없음</div></div></section><div class="layout"><section class="panel"><div class="panel-head"><div><h2>수련생별 납부 현황</h2><p>이름을 누르면 수련생 정보와 납부 내역을 확인할 수 있어요.</p></div><input class="search" id="search" placeholder="이름 검색" value="${esc(filter)}"></div><div class="table-wrap"><table><thead><tr><th>수련생</th><th>월 회비</th><th>납부액</th><th>진행</th><th>납부 상태</th><th>최근 납부</th><th>빠른 기록</th></tr></thead><tbody>${students.length?students.map(s=>{let paidAmt=sumRec(s,key),d=due(s),pct=Math.min(100,Math.round(paidAmt/d*100)),status=paidAmt>=d?'완납':paidAmt>0?'부분 납부':'미납',cls=paidAmt>=d?'paid':paidAmt>0?'partial':'unpaid',recs=monthRec(s,key),last=recs.length?recs.at(-1).date:'—';return `<tr><td><div class="student"><div class="avatar">${esc(s.name.slice(0,1))}</div><div><div class="name" data-profile="${esc(s.id)}">${esc(s.name)}</div><div class="subline">${esc(s.schedule||'주 5회')}${s.discounts?.length?' · '+esc(s.discounts.join(', ')):''}</div></div></div></td><td class="money">${money(d)}</td><td class="money">${money(paidAmt)}</td><td><div class="progress"><i style="width:${pct}%"></i></div></td><td><span class="status ${cls}">${status}</span></td><td>${last}</td><td><div class="row-actions"><button class="tiny pay" data-pay="${esc(s.id)}">＋ 납부</button><button class="tiny" data-profile="${esc(s.id)}">내역</button></div></td></tr>`}).join(''):`<tr><td colspan="7"><div class="empty">아직 등록된 수련생이 없습니다.<br>‘수련생 등록’으로 시작하세요.</div></td></tr>`}</tbody></table></div></section><aside class="side"><div class="panel"><h3>이번 달 회비 요약</h3><div class="barrow"><span>완납</span><div class="bar"><i style="width:${all.length?paid/all.length*100:0}%"></i></div><strong>${paid}명</strong></div><div class="barrow"><span>부분</span><div class="bar"><i style="width:${all.length?partial/all.length*100:0}%;background:#e4a53b"></i></div><strong>${partial}명</strong></div><div class="barrow"><span>미납</span><div class="bar"><i style="width:${all.length?(all.length-paid-partial)/all.length*100:0}%;background:#cf7467"></i></div><strong>${all.length-paid-partial}명</strong></div><div class="minirow"><span>현금 수납</span><b>${money(all.reduce((a,s)=>a+monthRec(s,key).filter(r=>r.method==='현금').reduce((x,r)=>x+(+r.amount||0),0),0))}</b></div><div class="minirow"><span>카드 수납</span><b>${money(all.reduce((a,s)=>a+monthRec(s,key).filter(r=>r.method==='카드').reduce((x,r)=>x+(+r.amount||0),0),0))}</b></div></div><div class="panel"><h3>연말 현금 납부 자료</h3><p>선택한 연도의 현금 납부 기록을 수련생별로 모아 출력합니다. 카드 기록은 포함하지 않습니다.</p><div class="field"><label>출력 연도</label><select id="year">${[new Date().getFullYear(),new Date().getFullYear()-1,new Date().getFullYear()+1].map(y=>`<option>${y}</option>`).join('')}</select></div><button class="btn primary" id="annual" style="width:100%">현금 납부 자료 미리보기</button></div><div class="panel"><h3>기본 회비</h3><div class="minirow"><span>신규 수련생 기본값</span><b>${money(db.settings.defaultFee)}</b></div><p style="margin-bottom:0">수련생별 금액은 개별 조정할 수 있습니다.</p></div></aside></div></main><div id="modal"></div>`;
 document.querySelector('#prev').onclick=()=>{viewDate.setMonth(viewDate.getMonth()-1);render()};document.querySelector('#next').onclick=()=>{viewDate.setMonth(viewDate.getMonth()+1);render()};document.querySelector('#today').onclick=()=>{viewDate=new Date();render()};document.querySelector('#add').onclick=()=>studentForm();document.querySelector('#settings').onclick=()=>settingsForm();document.querySelector('#search').oninput=e=>{filter=e.target.value;const pos=e.target.selectionStart;render();const el=document.querySelector('#search');el.focus();el.setSelectionRange(pos,pos)};document.querySelectorAll('[data-profile]').forEach(x=>x.onclick=()=>profile(x.dataset.profile));document.querySelectorAll('[data-pay]').forEach(x=>x.onclick=()=>payForm(x.dataset.pay));document.querySelector('#annual').onclick=()=>annualPrint(+document.querySelector('#year').value);
}
function showModal(html){const m=document.querySelector('#modal');m.innerHTML=`<div class="overlay" id="overlay"><div class="modal">${html}</div></div>`;document.querySelector('#overlay').onclick=e=>{if(e.target.id==='overlay')m.innerHTML=''};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>m.innerHTML='')}
function studentForm(id){let s=id?db.students.find(x=>x.id===id):null;showModal(`<h2>${s?'수련생 정보 수정':'수련생 등록'}</h2><p class="hint">회비와 수련 형태는 수련생별로 기본 설정과 다르게 조정할 수 있습니다.</p><form id="studentform"><div class="formgrid"><div class="field"><label>이름 *</label><input name="name" required value="${esc(s?.name||'')}" placeholder="수련생 이름"></div><div class="field"><label>월 회비 (원)</label><input name="fee" type="number" min="0" value="${s?.fee??db.settings.defaultFee}"></div><div class="field"><label>수련 횟수</label><select name="schedule">${['주 5회','주 3회','주 2회','주 1회','기타'].map(x=>`<option ${s?.schedule===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>할인/조정 메모 (선택)</label><input name="memo" value="${esc(s?.memo||'')}" placeholder="예: 형제할인 10,000원"></div><div class="field full"><label>할인 유형 (복수 선택 가능)</label><div class="checks">${['형제할인','지인할인','소개 할인','주3회 조정','기타'].map(d=>`<label><input type="checkbox" name="discount" value="${d}" ${(s?.discounts||[]).includes(d)?'checked':''}> ${d}</label>`).join('')}</div></div></div><div class="modal-actions"><button type="button" class="btn light" data-close>취소</button><button class="btn primary">저장</button></div></form>${s?`<div class="modal-actions" style="justify-content:flex-start;margin-top:15px"><button type="button" class="btn danger" id="remove">수련생 삭제</button></div>`:''}`);document.querySelector('#studentform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),obj={id:s?.id||crypto.randomUUID(),name:f.get('name').trim(),fee:+f.get('fee')||0,schedule:f.get('schedule'),memo:f.get('memo').trim(),discounts:f.getAll('discount'),records:s?.records||{}};if(s)Object.assign(s,obj);else db.students.push(obj);save();render()};if(s)document.querySelector('#remove').onclick=()=>{if(confirm(`${s.name} 수련생을 삭제할까요? 납부 기록도 함께 삭제됩니다.`)){db.students=db.students.filter(x=>x.id!==id);save();render()}}}
function settingsForm(){showModal(`<h2>기본 설정</h2><p class="hint">신규 등록 수련생에게 적용할 기본 월 회비를 설정하세요. 기존 수련생의 개별 회비는 변경되지 않습니다.</p><form id="settingsform"><div class="field"><label>기본 월 회비 (원)</label><input name="fee" type="number" min="0" required value="${db.settings.defaultFee}"></div><div class="field"><label>비밀번호 변경</label><input name="pw" type="password" minlength="4" placeholder="변경할 경우에만 입력 (4자 이상)"></div><div class="modal-actions"><button type="button" class="btn light" data-close>취소</button><button class="btn primary">저장</button></div></form><div class="note">데이터 내보내기/가져오기는 다음 단계로 추가할 수 있습니다. 현재 기록은 이 브라우저의 저장 공간에만 있습니다.</div>`);document.querySelector('#settingsform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);db.settings.defaultFee=+f.get('fee')||0;if(f.get('pw'))db.password=await hash(f.get('pw'));save();render()}}
function profile(id){let s=db.students.find(x=>x.id===id);if(!s)return;let keys=Object.keys(s.records||{}).sort().reverse(),history=keys.map(k=>`<div class="minirow"><span>${k}</span><b>${(s.records[k]||[]).map(r=>`${esc(r.date)} ${esc(r.method)} ${money(r.amount)}`).join('<br>')||'—'}</b></div>`).join('');showModal(`<h2>${esc(s.name)} <span class="pill">${esc(s.schedule||'')}</span></h2><p class="hint">월 회비 ${money(due(s))}${s.discounts?.length?' · '+esc(s.discounts.join(', ')):''}${s.memo?' · '+esc(s.memo):''}</p><div style="display:flex;gap:8px;margin-bottom:16px"><button class="btn primary" id="payfrom">＋ 납부 기록</button><button class="btn light" id="editfrom">정보 수정</button></div><h3 style="font-size:13px">월별 납부 내역</h3>${history||'<p class="hint">아직 납부 기록이 없습니다.</p>'}<div class="modal-actions"><button class="btn light" data-close>닫기</button></div>`);document.querySelector('#payfrom').onclick=()=>payForm(id);document.querySelector('#editfrom').onclick=()=>studentForm(id)}
function payForm(id){let s=db.students.find(x=>x.id===id),records=monthRec(s),current=records.reduce((a,x)=>a+(+x.amount||0),0),remain=Math.max(0,due(s)-current);showModal(`<h2>${esc(s.name)} 납부 기록</h2><p class="hint">${viewDate.getFullYear()}년 ${viewDate.getMonth()+1}월 · 회비 ${money(due(s))} · 남은 금액 ${money(remain)}</p><form id="payform"><div class="formgrid"><div class="field"><label>납부 금액 (원)</label><input name="amount" type="number" min="1" required value="${remain||due(s)}"></div><div class="field"><label>결제 방법</label><select name="method"><option>현금</option><option>카드</option><option>계좌이체</option></select></div><div class="field"><label>납부일</label><input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>메모 (선택)</label><input name="memo" placeholder="예: 현금영수증 번호 등"></div></div><div class="modal-actions"><button type="button" class="btn light" data-close>취소</button><button class="btn primary">기록 저장</button></div></form>`);document.querySelector('#payform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),date=f.get('date'),record={amount:+f.get('amount'),method:f.get('method'),date,memo:f.get('memo').trim()};const recordMonth=date.slice(0,7);s.records??={};s.records[recordMonth]??=[];s.records[recordMonth].push(record);save();viewDate=new Date(+recordMonth.slice(0,4),+recordMonth.slice(5,7)-1,1);render()}}
function annualPrint(year){let rows=[];for(const s of db.students){let cash=0,months=[];for(const [k,rs] of Object.entries(s.records||{})){if(k.startsWith(String(year))){const v=rs.filter(r=>r.method==='현금').reduce((a,r)=>a+(+r.amount||0),0);if(v){cash+=v;months.push(`${+k.slice(5)}월 ${money(v)}`)}}}if(cash)rows.push({name:s.name,cash,months:months.join(', ')})}rows.sort((a,b)=>a.name.localeCompare(b.name,'ko'));let total=rows.reduce((a,r)=>a+r.cash,0);showModal(`<div class="printhead" style="display:none"><h1>${year}년 현금 납부 내역</h1><p>도장 회비 관리 · 출력일 ${new Date().toLocaleDateString('ko-KR')}</p></div><p class="hint no-print">${year}년 현금으로 기록된 납부 내역 ${rows.length}건을 모았습니다. 인쇄 창에서 프린터 또는 PDF 저장을 선택하세요.</p>${rows.length?`<table class="print-table"><thead><tr><th>수련생 이름</th><th>납부 월별 내역</th><th>연간 현금 납부액</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.months)}</td><td>${money(r.cash)}</td></tr>`).join('')}</tbody></table><div class="print-total">총 현금 납부액: ${money(total)}</div>`:`<div class="empty">${year}년 현금 납부 기록이 없습니다.</div>`}<p class="printnote">본 자료는 앱에 입력된 납부 기록을 기준으로 작성한 확인용 내역입니다. 세액공제 증빙 또는 공식 현금영수증을 대체하지 않습니다.</p><div class="modal-actions no-print"><button class="btn light" data-close>닫기</button><button class="btn primary" id="printnow">인쇄 / PDF 저장</button></div>`);document.querySelector('#printnow').onclick=()=>window.print()}
render();
</script></body></html>
